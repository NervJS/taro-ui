on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --openssl-legacy-provider
  RN_APP_NAME: Taro-UI-Demo
  RN_APP_LOGO: https://pic5.58cdn.com.cn/nowater/fangfe/n_v25a185c1657984016926f26af591912c4.jpg
  RN_WORKDIR: examples/demo-rn

jobs:
  taro_release_job:
    runs-on: ubuntu-latest
    name: Taro Bundle Release
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Metro 0.73 (demo-rn) hangs on Node 20+; pin 18 like the rest of CI.
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --shamefully-hoist

      - name: Build taro-ui
        run: pnpm run build:ui

      - name: Release Taro React Native bundle
        working-directory: examples/demo-rn
        run: |
          set -euo pipefail
          mkdir -p release/ios/assets release/android/assets release/qrcode

          # pnpm run forwards a literal "--", which Taro still treats as success
          # even when Metro fails. Call taro directly and assert bundle files.
          # Keep --publicPath short: Android copies assets into drawable-* filenames
          # derived from the public path + pnpm store path, which overflows ENAMETOOLONG.
          pnpm exec taro build --type rn --reset-cache --platform ios \
            --bundle-output release/ios/main.js \
            --assets-dest release/ios/assets \
            --sourcemap-output release/ios/main.map \
            --publicPath /assets
          test -s release/ios/main.js
          test "$(wc -c < release/ios/main.js)" -gt 100000

          pnpm exec taro build --type rn --reset-cache --platform android \
            --bundle-output release/android/main.js \
            --assets-dest release/android/assets \
            --sourcemap-output release/android/main.map \
            --publicPath /assets
          test -s release/android/main.js
          test "$(wc -c < release/android/main.js)" -gt 100000

      - name: Generate Playground QR codes
        run: |
          node scripts/rn-release-qr.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --refname "${GITHUB_REF_NAME}" \
            --reftype "${GITHUB_REF_TYPE}" \
            --workingdirectory "${RN_WORKDIR}" \
            --appname "${RN_APP_NAME}" \
            --logo "${RN_APP_LOGO}"

      - name: Upload Qr Image
        uses: actions/upload-artifact@v4
        with:
          name: bundle-qr-code
          path: |
            examples/demo-rn/release/qrcode/ios.png
            examples/demo-rn/release/qrcode/android.png
            examples/demo-rn/release/ios/main.js
            examples/demo-rn/release/android/main.js

      - name: Commit RN bundles for jsDelivr
        if: github.ref_type == 'branch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add examples/demo-rn/release
          if git diff --cached --quiet; then
            echo 'No bundle changes to commit'
            exit 0
          fi
          git commit -m "release: commit RN bundles by github actions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Attach bundles to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --notes "Taro UI React Native demo bundles. Scan the QR codes with [Taro Playground](https://github.com/wuba/taro-playground)."
          cp examples/demo-rn/release/ios/main.js ios-main.js
          cp examples/demo-rn/release/android/main.js android-main.js
          cp examples/demo-rn/release/qrcode/ios.png ios-qr.png
          cp examples/demo-rn/release/qrcode/android.png android-qr.png
          gh release upload "${GITHUB_REF_NAME}" \
            ios-main.js android-main.js ios-qr.png android-qr.png \
            --clobber
          gh release edit "${GITHUB_REF_NAME}" --notes "$(cat <<EOF
          Use [Taro Playground App](https://github.com/wuba/taro-playground) to scan the following qr codes:

          | | Android | iOS |
          | :--: | :--: | :--: |
          | QR code | ![AndroidBundle](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/android-qr.png) | ![iOSBundle](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ios-qr.png) |
          | Bundle file url | https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/android-main.js | https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ios-main.js |
          EOF
          )"
